[www]
user  = www-data
group = www-data

listen = 127.0.0.1:9000

; ── Gestión de procesos ──────────────────────────────────────────────────────
; "ondemand" es más seguro que "dynamic" en contenedores:
; solo crea workers cuando hay requests, los mata cuando no hay carga.
pm = static

; Máximo de workers simultáneos.
; Fórmula conservadora: (RAM_disponible_para_PHP / 50MB_por_worker)
; Con 20GB total y otros servicios, dejamos 4GB para PHP = ~80 workers
pm.max_children = 50

; Cuántos requests atiende cada worker antes de reiniciarse (evita memory leaks)
pm.max_requests = 0

; Workers que quedan en idle esperando
pm.process_idle_timeout = 10s

; ── Timeouts ─────────────────────────────────────────────────────────────────
request_terminate_timeout = 60s
request_slowlog_timeout   = 10s
slowlog                   = /var/log/php-fpm-slow.log

; ── Logging ──────────────────────────────────────────────────────────────────
access.log   = /proc/self/fd/2
catch_workers_output = yes
php_flag[display_errors] = off
php_admin_value[error_log]       = /proc/self/fd/2
php_admin_flag[log_errors]       = on

; ── Memoria por worker ───────────────────────────────────────────────────────
php_admin_value[memory_limit] = 256M

; ── Seguridad básica ─────────────────────────────────────────────────────────
; Bloquea xmlrpc.php y otros archivos WordPress que aparecen en los logs
; (esto lo manejás mejor desde nginx, pero por si acaso)
security.limit_extensions = .php
